services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: botstackhq-postgres
    environment:
      POSTGRES_DB: botstackhq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d botstackhq']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
