[project]
name = "botstackhq-document-ai"
version = "0.1.0"
description = "BotStackHQ ComplianceStack — Document AI service (FastAPI)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W = pycodestyle, F = pyflakes, I = isort, B = bugbear, UP = pyupgrade,
# SIM = flake8-simplify, RUF = ruff-specific. Keeps the bar sensible without
# being noisy on a small scaffold.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
